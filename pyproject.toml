[project]
name = "paint-by-numbers-agent"
version = "0.1.0"
description = "A single-agent workflow for turning photos into beginner-friendly paint-by-numbers kits."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "openai>=2.15",
  "openai-agents>=0.6",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[project.scripts]
paint-by-numbers-agent = "pbn_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbn_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

