[project]
name = "paint-by-numbers"
version = "0.1.0"
description = "Turn photos into beginner-friendly paint-by-numbers kits."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=11.0",
  "scikit-image>=0.24",
  "scipy>=1.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbn"]
